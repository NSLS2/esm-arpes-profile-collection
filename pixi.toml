[workspace]
channels = ["conda-forge"]
name = "esm-arpes-profile-collection"
platforms = ["linux-64"]
version = "2026.3.0"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
bluesky-base = ">=1.15.1,<2"
bluesky-queueserver = ">=0.0.25,<0.0.26"
matplotlib-base= ">=3.10.9,<4"
networkx = ">=3.4.2,<4"
# nslsii = "==0.11.8"
numpy = "*"
ophyd = ">=1.11.2,<2"
pyepics = "*"
python = ">=3.11"
semver = ">=3.0.4,<4"
tiled-client = ">=0.2.14,<0.3"
# needed until we get ophyd-async packaged
colorlog = ">=6.11.0,<7"
pydantic-numpy = ">=9.0.2,<10"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
databroker = "==2.0.0"
p4p = ">=4.2.2,<5"
epicscorelibs = ">=7.0.7.99.1.1,<8"
bluesky-tiled-plugins = ">=2.0.9,<3"
nexusformat = ">=2.0.3,<3"

[feature.profile.pypi-dependencies]
ophyd-async = { version = ">=0.21.1, <0.22", extras = ["ca", "pva"] }
nslsii = { git = "https://github.com/nmaytan/nslsii.git", rev = "380bd34" }


[feature.qs.dependencies]
bluesky-queueserver = ">=0.0.25,<0.0.26"
bluesky-httpserver = ">=0.0.12,<0.0.13"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"


[feature.terminal.dependencies]
ipython = ">=9.16.1,<10"
numpy = ">=2.5.2,<3"
pyqt = ">=5.15.11,<6"
pyqtgraph = ">=0.14.0,<0.15"

[feature.terminal.pypi-dependencies]
bsstudio = { path = "/home2/xf21id1/git/bsstudio", editable = true }

[feature.terminal.tasks]
start = "unset SESSION_MANAGER && MPLBACKEND=Qt5Agg ipython --profile-dir=."
pvs = "ipython --profile-dir=. -c 'get_pv_types(); exit()'"

[feature.test.dependencies]
pytest = ">=9.1.1,<10"

[feature.test.tasks]
tests = "pytest tests"

[environments]
terminal = {features=["profile", "terminal"], solve-group="profile"}
qs = {features=["profile", "qs"], solve-group="profile"}
test = {features=["profile", "test"], solve-group="profile"}

[dependencies]
python-confluent-kafka = ">=2.15.0,<3"
